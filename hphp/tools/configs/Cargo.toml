[package]
name = "generate_configs_lib"
version = "0.0.0"
edition = "2024"
repository = "https://github.com/facebook/hhvm"
license = "MIT"

[[bin]]
name = "generate_configs"
path = "generate_configs.rs"

[lib]
path = "generate_configs_lib.rs"

[dependencies]
clap = { version = "4.5.42", features = ["derive", "env", "string", "unicode", "wrap_help"] }
convert_case = "0.4.0"
nom = "8"
nom-language = "0.1"
